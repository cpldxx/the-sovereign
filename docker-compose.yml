services:
  arcadedb:
    image: arcadedata/arcadedb:26.9.1
    environment:
      ARCADEDB_SETTINGS: >-
        -Darcadedb.server.rootPassword=${ARCADEDB_PASS:-sovereign_pass}
      # Keep the heap modest so Ollama keeps most of the RAM.
      ARCADEDB_OPTS_MEMORY: -Xms512m -Xmx2g
    ports:
      - "127.0.0.1:2480:2480"   # HTTP API + Studio (localhost only)
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    networks:
      - sovereign-net

  # Web search for DeerFlow (metasearch, no API key). JSON API at http://localhost:8088/search?format=json
  searxng:
    image: searxng/searxng:latest
    environment:
      # Signs SearXNG's cookies. Local-only service; override in a root .env for anything shared.
      SEARXNG_SECRET: ${SEARXNG_SECRET:-sovereign-local-searxng}
    ports:
      - "127.0.0.1:8088:8080"
    volumes:
      - ./docker/searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - sovereign-net

  # Page fetching for DeerFlow: renders JavaScript pages with headless Chromium, returns clean markdown.
  crawl4ai:
    image: unclecode/crawl4ai:latest
    environment:
      # Bearer token the research service sends. Local-only; override in a root .env for anything shared.
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:-sovereign-local-crawl4ai}
    ports:
      - "127.0.0.1:11235:11235"
    shm_size: 1g
    networks:
      - sovereign-net

  # ── Observability (optional): LangFuse traces every agent call — `docker compose --profile observability up -d`
  # UI on http://localhost:3000 (sign up there; new users join the "sovereign" project automatically).
  # The services trace only when LANGFUSE_* keys are set in their .env. Local-only defaults below; override in a
  # root .env for anything shared.
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4
    profiles: [observability]
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      langfuse-postgres: {condition: service_healthy}
      langfuse-minio: {condition: service_healthy}
      langfuse-redis: {condition: service_healthy}
      langfuse-clickhouse: {condition: service_healthy}
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:${LANGFUSE_DB_PASS:-sovereign-local-postgres}@langfuse-postgres:5432/postgres
      SALT: ${LANGFUSE_SALT:-sovereign-local-salt}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:-5f0b1a4c2e8d7f6a9b3c1d0e2f4a6b8c0d2e4f6a8b0c1d3e5f7a9b2c4d6e8f0a}
      TELEMETRY_ENABLED: "false"
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASS:-sovereign-local-clickhouse}
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASS:-sovereign-local-minio}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASS:-sovereign-local-minio}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      REDIS_HOST: langfuse-redis
      REDIS_PORT: "6379"
      REDIS_AUTH: ${LANGFUSE_REDIS_PASS:-sovereign-local-redis}
    networks:
      - sovereign-net

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4
    profiles: [observability]
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-sovereign-local-nextauth}
      # One org + project with fixed API keys, so the services can trace without any setup in the UI.
      LANGFUSE_INIT_ORG_ID: sovereign
      LANGFUSE_INIT_ORG_NAME: Sovereign
      LANGFUSE_INIT_PROJECT_ID: sovereign
      LANGFUSE_INIT_PROJECT_NAME: sovereign
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-pk-lf-sovereign-local}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-sk-lf-sovereign-local}
      LANGFUSE_DEFAULT_ORG_ID: sovereign
      LANGFUSE_DEFAULT_ORG_ROLE: OWNER
      LANGFUSE_DEFAULT_PROJECT_ID: sovereign
      LANGFUSE_DEFAULT_PROJECT_ROLE: OWNER
    networks:
      - sovereign-net

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:25.12
    profiles: [observability]
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASS:-sovereign-local-clickhouse}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - sovereign-net

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    profiles: [observability]
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASS:-sovereign-local-minio}
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 10
    networks:
      - sovereign-net

  # Valkey: BSD-licensed Redis fork, drop-in for LangFuse's queue.
  langfuse-redis:
    image: valkey/valkey:8
    profiles: [observability]
    restart: unless-stopped
    command: --requirepass ${LANGFUSE_REDIS_PASS:-sovereign-local-redis} --maxmemory-policy noeviction
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 3s
      timeout: 10s
      retries: 10
    networks:
      - sovereign-net

  langfuse-postgres:
    image: postgres:17
    profiles: [observability]
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASS:-sovereign-local-postgres}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - sovereign-net

  # ── The app (`./sovereign up`): KG, Hermes, Research and the web UI in containers ────────────────────────────────
  # Settings come from the root .env (`./sovereign init` writes it); data lives in ./data (bind mounts, so it
  # survives rebuilds and stays visible). Only the web UI publishes a port.
  kg:
    build: {context: ., dockerfile: kg/Dockerfile}
    image: sovereign-kg
    profiles: [app]
    env_file: .env
    environment:
      LANGFUSE_TRACING: ${SOVEREIGN_TRACING:-false}   # ./sovereign up --observability turns it on
      ARCADEDB_URL: http://arcadedb:2480
      SOVEREIGN_KG_URL: http://kg:8080
      SOVEREIGN_RESEARCH_URL: http://research:8070
      SOVEREIGN_HERMES_URL: http://hermes:8090     # the crew wakes the Head when a teammate reports
      SOVEREIGN_DOMAINS_DIR: /data/domains
      SCOUT_CATALOG: /data/scout-catalog.json
      LANGFUSE_BASE_URL: http://langfuse-web:3000
    volumes:
      - ./data/kg:/data
      - /var/run/docker.sock:/var/run/docker.sock   # sensor sandboxes run as sibling containers
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [arcadedb]
    restart: unless-stopped
    networks: [sovereign-net]

  research:
    build: {context: ., dockerfile: research/Dockerfile}
    image: sovereign-research
    profiles: [app]
    env_file: .env
    environment:
      LANGFUSE_TRACING: ${SOVEREIGN_TRACING:-false}   # ./sovereign up --observability turns it on
      SOVEREIGN_KG_URL: http://kg:8080
      SEARXNG_URL: http://searxng:8080
      CRAWL4AI_URL: http://crawl4ai:11235
      RESEARCH_DATA: /data/jobs
      DEER_FLOW_HOME: /data/deerflow-home
      LANGFUSE_BASE_URL: http://langfuse-web:3000
    volumes:
      - ./data/research:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [kg, searxng, crawl4ai]
    restart: unless-stopped
    networks: [sovereign-net]

  hermes:
    build: {context: ., dockerfile: hermes/Dockerfile}
    image: sovereign-hermes
    profiles: [app]
    env_file: .env
    environment:
      LANGFUSE_TRACING: ${SOVEREIGN_TRACING:-false}   # ./sovereign up --observability turns it on
      SOVEREIGN_KG_URL: http://kg:8080
      HERMES_HOME: /data/hermes-home
      HF_HOME: /data/hf                 # the speech model, downloaded on first use
      VOICE_TTS: hermes
      LANGFUSE_BASE_URL: http://langfuse-web:3000
    volumes:
      - ./data/hermes:/data
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [kg]
    restart: unless-stopped
    networks: [sovereign-net]

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_LANGFUSE_URL: ${LANGFUSE_PUBLIC_URL:-}
    image: sovereign-web
    profiles: [app]
    ports:
      - "${SOVEREIGN_BIND:-127.0.0.1}:${SOVEREIGN_PORT:-8000}:80"
    depends_on: [kg, hermes, research]
    restart: unless-stopped
    networks: [sovereign-net]

  # ── Ollama in a container (`./sovereign up --ollama`): for Linux machines (add a GPU reservation for NVIDIA).
  # On a Mac, Ollama runs on the host — Docker can't use the Apple GPU.
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    networks: [sovereign-net]

volumes:
  ollama_models:
  arcadedb_data:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:

networks:
  sovereign-net:
