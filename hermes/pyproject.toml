[project]
name = "sovereign-hermes"
version = "0.1.0"
description = "Sovereign orchestration — Hermes agents that reach the KG only through the Sovereign KG API"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Kept in its own venv: hermes-agent pins ~120 deps with == (e.g. openai==2.24.0).
    # mcp: its MCP client, used to reach the Sovereign KG. anthropic: Claude via HEAD_MODEL.
    "hermes-agent[mcp,anthropic,voice]>=0.19.0",
    "fastapi>=0.133.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.41.0",
    "langfuse>=4",
    "av>=12,<16",
    "mlx-whisper>=0.4",
]
