# DeerFlow configuration for Sovereign research missions.
# Only web search + our fetch tool; no shell, no file tools, no extra LLM calls (titles, suggestions,
# memory, input polishing) — every model call goes to research. See DeerFlow's config.example.yaml
# (v2.1.0) for every option.
config_version: 52
log_level: warning

models:
  - name: local
    display_name: Research model (Ollama)
    use: langchain_ollama:ChatOllama
    model: $RESEARCH_OLLAMA_MODEL
    base_url: $OLLAMA_HOST
    reasoning: false          # think:false on Ollama's native API — ~9x faster, same quality (measured)
    temperature: 0.2
    # DeerFlow's own budget (summarizes long runs before this). No num_ctx: Ollama then serves the same
    # context to every client (KG, Hermes, DeerFlow) — a different num_ctx would reload the model on each switch.
    context_window: 65536
    supports_thinking: false
    supports_vision: false

tool_groups:
  - name: web

tools:
  # SearXNG with pacing (sovereign_research/search.py). runner.py swaps in Tavily or Brave
  # when TAVILY_API_KEY / BRAVE_API_KEY is set.
  - name: web_search
    group: web
    use: sovereign_research.search:web_search_tool
  # Sovereign's fetch: robots.txt, per-site pacing, crawl4ai rendering, and the full page kept for the KG.
  - name: web_fetch
    group: web
    use: sovereign_research.fetch:web_fetch_tool

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  allow_host_bash: false

title:
  enabled: false
suggestions:
  enabled: false
memory:
  enabled: false
input_polish:
  enabled: false
