<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>A research charter written once with you; then every night: research, learn, exam; what it cannot answer becomes the next night's research; ask it and it answers with sources</title>
<rect x="0.5" y="0.5" width="959" height="249" rx="12" fill="#1C2024" stroke="#3B424A"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7D7A73"/></marker></defs>
<path d="M226 62 V52 H754 V62" fill="none" stroke="#7D7A73" stroke-width="1.2"/>
<rect x="442.0" y="42" width="96" height="20" fill="#1C2024"/>
<text x="490.0" y="57" text-anchor="middle" font-size="13" fill="#A09C92">every night</text>
<rect x="30" y="74" width="160" height="70" rx="10" fill="#24292E" stroke="#3B424A" stroke-dasharray="5 4"/>
<text x="110.0" y="104" text-anchor="middle" font-size="18" font-weight="600" fill="#EDE7DA">Charter</text>
<text x="110.0" y="126" text-anchor="middle" font-size="13" fill="#A09C92">once, with you</text>
<line x1="194" y1="109.0" x2="216" y2="109.0" stroke="#7D7A73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="220" y="74" width="160" height="70" rx="10" fill="#24292E" stroke="#3B424A"/>
<text x="300.0" y="104" text-anchor="middle" font-size="18" font-weight="600" fill="#EDE7DA">Research</text>
<text x="300.0" y="126" text-anchor="middle" font-size="13" fill="#A09C92">the web and papers</text>
<line x1="384" y1="109.0" x2="406" y2="109.0" stroke="#7D7A73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="410" y="74" width="160" height="70" rx="10" fill="#24292E" stroke="#3B424A"/>
<text x="490.0" y="104" text-anchor="middle" font-size="18" font-weight="600" fill="#EDE7DA">Learn</text>
<text x="490.0" y="126" text-anchor="middle" font-size="13" fill="#A09C92">facts with sources</text>
<line x1="574" y1="109.0" x2="596" y2="109.0" stroke="#7D7A73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="600" y="74" width="160" height="70" rx="10" fill="#EDE7DA" stroke="#EDE7DA"/>
<text x="680.0" y="104" text-anchor="middle" font-size="18" font-weight="600" fill="#202428">Exam</text>
<text x="680.0" y="126" text-anchor="middle" font-size="13" fill="#555C63">held-out questions</text>
<line x1="764" y1="109.0" x2="786" y2="109.0" stroke="#7D7A73" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="790" y="74" width="160" height="70" rx="10" fill="#24292E" stroke="#3B424A"/>
<text x="870.0" y="104" text-anchor="middle" font-size="18" font-weight="600" fill="#EDE7DA">Answer</text>
<text x="870.0" y="126" text-anchor="middle" font-size="13" fill="#A09C92">with sources</text>
<path d="M680.0 148 V182 Q680.0 194 668.0 194 H312.0 Q300.0 194 300.0 182 V150" fill="none" stroke="#7D7A73" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="490.0" y="216" text-anchor="middle" font-size="13" fill="#A09C92">what it can't answer is the next night's research</text>
</svg>