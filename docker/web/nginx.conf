# One origin for the UI and the APIs: the session cookie is first-party, and only this port is published.
server {
    listen 80;
    client_max_body_size 30m;          # voice uploads
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Streams (the Head's SSE, MCP) pass through unbuffered; ingest and research calls can take minutes.
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/kg/       { proxy_pass http://kg:8080/; }
    location /api/hermes/   { proxy_pass http://hermes:8090/; }
    location /api/research/ { proxy_pass http://research:8070/; }
}
