# SearXNG for DeerFlow's web_search (local, no API key). Merged over SearXNG's defaults.
use_default_settings: true
server:
  limiter: false          # local use only — the port is bound to 127.0.0.1
  image_proxy: false
search:
  formats: [html, json]   # DeerFlow reads the JSON API
  safe_search: 0

# More engines spread the load: free engines rate-limit (or CAPTCHA) a single client after
# many queries, and Sovereign never works around that — it asks other engines instead.
# Tried one by one on 2026-10-30: google cse, yahoo, yandex, naver and mwmbl answered; duckduckgo
# (CAPTCHA), qwant (access denied), brave (too many requests) and bing (connection refused) refused
# every query, so they are off rather than asked again and again. Try them again now and then.
# (mojeek and startpage, on here before, are no longer among SearXNG's engines.)
engines:
  - name: yahoo
    disabled: false
  - name: yandex
    disabled: false
  - name: naver
    disabled: false
  - name: mwmbl
    disabled: false
  - name: duckduckgo
    disabled: true
  - name: qwant
    disabled: true
  - name: brave
    disabled: true
  - name: bing
    disabled: true
