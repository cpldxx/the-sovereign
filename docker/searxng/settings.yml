# SearXNG for DeerFlow's web_search (local, no API key). Merged over SearXNG's defaults.
use_default_settings: true
server:
  limiter: false          # local use only — the port is bound to 127.0.0.1
  image_proxy: false
search:
  formats: [html, json]   # DeerFlow reads the JSON API
  safe_search: 0

# More engines spread the load: free engines rate-limit (or CAPTCHA) a single client after
# many queries, and Sovereign never works around that — it asks other engines instead.
engines:
  - name: bing
    disabled: false
  - name: yahoo
    disabled: false
  - name: mojeek
    disabled: false
  - name: qwant
    disabled: false
  - name: startpage
    disabled: false
