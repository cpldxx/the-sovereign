[project]
name = "sovereign-kg"
version = "0.1.0"
description = "Sovereign KG API — knowledge graph, ingest pipeline, domain management"
requires-python = ">=3.12,<3.14"
dependencies = [
    "docker>=7.1.0",
    "fastapi>=0.133.1",
    "httpx>=0.28.1",
    "langfuse>=4",
    "mcp>=2.3.0",
    "pydantic>=2.13.1",
    # slim + providers we use: openai (also Ollama's OpenAI-compatible API) and anthropic (Claude via env).
    "pydantic-ai-slim[openai,anthropic]>=2.0.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "db: needs ArcadeDB (docker compose up -d)",
    "sandbox: needs Docker and the sensor sandbox image",
    "live: needs the running services (./sovereign start)",
    "slow: calls the local model or the internet (minutes)",
]
